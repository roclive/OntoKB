[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontokb"
version = "0.1.0"
description = "Watch-later research pipeline with ontology-backed knowledge graph and rule engine, output to Obsidian"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
llm = ["openai>=2.40.0", "anthropic>=0.116.0"]
youtube = ["yt-dlp>=2024.1.1", "faster-whisper>=1.1.0"]
html = ["beautifulsoup4>=4.12"]
dev = ["pytest>=7.4"]

[project.scripts]
ontokb = "ontokb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
