# Copy to config.yaml and edit. config.yaml is gitignored.
interests:
  - AI agents
  - 大模型推理成本
  - 端侧 AI
  - 芯片

sources:
  youtube:
    # Watch Later has no official API. Two supported paths:
    # 1) Google Takeout export of "Watch later" -> CSV, set path below
    # 2) A regular playlist you maintain manually (yt-dlp readable)
    takeout_csv: null
    playlist_url: null
    cookies_file: null          # optional, for age/region gated videos
    max_video_minutes: 30
  netease:
    urls: []                    # explicit article URLs to ingest
    keywords: []                # reserved for column crawling (M1)

llm:
  provider: anthropic
  model: claude-fable-5
  fallback_model: claude-opus-4-8

paths:
  db: data/kb.db
  vault: vault

report:
  cadence_days: 7
